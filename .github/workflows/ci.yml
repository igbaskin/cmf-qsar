# The test suite on the three operating systems, and the application exercised headless.
#
# Two kinds of job.  "tests" installs the package from pyproject.toml with the newest versions
# that satisfy it, on the oldest and the newest Python the package supports, and runs pytest; then
# it starts the application under the offscreen Qt platform on the synthetic example, builds a
# model, computes the co-fields and takes the screenshots, which is what --autotest does, and
# fails unless the run printed AUTOTEST OK.  "locked" installs requirements-lock.txt instead, the
# versions every benchmark table was produced with, so that a change in a dependency and a change
# in the program are told apart when a number moves.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Qt's offscreen platform still loads the OpenGL, xkb, fontconfig and D-Bus libraries
      # the pyside6 wheels link against; a bare runner has only some of them.
      - name: Libraries Qt needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxcb-render-util0 libxcb-image0

      # crystals: ase and pymatgen, which the periodic side of the program and its tests import;
      # docs: matplotlib, which `cmf report` draws its figures with
      - name: Install the package with the application
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev,crystals,docs]"

      - name: The two commands exist
        run: |
          cmf --help
          cmf-app --help

      - name: Test suite
        run: python -m pytest tests -q --durations=10

      - name: The application, headless
        shell: bash
        run: |
          cmf-app examples/benzamides_synthetic.sdf --activity pActivity --test-fraction 0.25 \
            --autotest autotest.png | tee autotest.log
          grep -q "AUTOTEST OK" autotest.log

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotest-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            autotest*.png
            autotest.log
          if-no-files-found: ignore

  locked:
    name: ubuntu / the versions of the benchmarks
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Libraries Qt needs on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxcb-render-util0 libxcb-image0

      - name: Install the pinned versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .

      - name: Test suite
        run: python -m pytest tests -q

      - name: The manual typesets
        run: python docs/make_manual.py --out /tmp/CMF_manual.pdf

      # every result table and the tables the documents carry are what the result files give,
      # and the data files are the ones the manifest was made from
      - name: The tables and the manifest agree with the repository
        run: python benchmarks/run_all.py --check
