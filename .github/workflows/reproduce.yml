# The reproduction run of item 0 of docs/publication_plan.md: the benchmarks are recomputed on a
# machine that is not the author's, and the tables rebuilt from the new result files are compared
# with the tables the repository carries. A difference is the finding, not an error of the run.
#
# Only the benchmarks that register 30 minutes or less run here, 60 of the 87, about 15 hours in
# all, split into four groups of about four hours. A GitHub runner stops a job after six hours.
# The benchmarks left out are listed in docs/release_checklist.md with the reason for each.
#
# It is started by hand (Actions, "reproduce", Run workflow), because it costs hours of runner
# time and nothing in it changes between pushes.

name: reproduce

on:
  workflow_dispatch:
    inputs:
      group:
        description: 'Which group to run: 1, 2, 3, 4, or all'
        required: false
        default: all

jobs:
  reproduce:
    name: group ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Skip the groups that were not asked for
        id: want
        run: |
          if [ "${{ github.event.inputs.group }}" = "all" ] || \
             [ "${{ github.event.inputs.group }}" = "${{ matrix.group }}" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.want.outputs.run == 'yes'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Libraries Qt needs on Linux
        if: steps.want.outputs.run == 'yes'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxcb-render-util0 libxcb-image0

      - name: Install the versions the benchmarks were run under
        if: steps.want.outputs.run == 'yes'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .

      - name: The data files are the ones the manifest was made from
        if: steps.want.outputs.run == 'yes'
        run: python benchmarks/run_all.py --check

      - name: Group 1
        if: steps.want.outputs.run == 'yes' && matrix.group == 1
        run: >
          python benchmarks/run_all.py --compute
          batch chirality conformal corrosion errorpred fluctuation guest_atoms kcca kfda kpls
          lapkrr local_cofield metabolism perfield

      - name: Group 2
        if: steps.want.outputs.run == 'yes' && matrix.group == 2
        run: >
          python benchmarks/run_all.py --compute
          corrosion_hcl cyclodextrin design designloop fraggrow hammett interactions kcca_pocket
          maskedmatch multitask protonation ranking sites structure transformfield

      - name: Group 3
        if: steps.want.outputs.run == 'yes' && matrix.group == 3
        run: >
          python benchmarks/run_all.py --compute
          active antitarget diagnose evidence exposure fe110 fusion guest_design hops klr
          restriction solvent speed topomer trajectory

      - name: Group 4
        if: steps.want.outputs.run == 'yes' && matrix.group == 4
        run: >
          python benchmarks/run_all.py --compute
          alignment bioisostere bound cases cofield_error lowrank matbench_phonons md mixing
          nonlinearity nystrom query sac selectivity transfer two_endpoints

      # The tables are rebuilt from the result files this run produced. The step fails if a table
      # differs from the one the repository carries, which is what the reproduction run asks.
      - name: Do the new result files give the tables the repository carries
        if: steps.want.outputs.run == 'yes'
        run: python benchmarks/run_all.py --check

      - name: What moved, if anything
        if: ${{ always() && steps.want.outputs.run == 'yes' }}
        run: |
          git diff --stat -- benchmarks/results || true
          git diff -- benchmarks/results | head -400 || true

      - name: Keep the result files of this run
        if: ${{ always() && steps.want.outputs.run == 'yes' }}
        uses: actions/upload-artifact@v4
        with:
          name: results-group-${{ matrix.group }}
          # the tables and the records they are built from; the large intermediate files a
          # benchmark writes beside them (quantum outputs, kernels) are not kept
          path: |
            benchmarks/results/**/*.json
            benchmarks/results/**/*.md
            benchmarks/results/**/*.csv
          if-no-files-found: ignore
