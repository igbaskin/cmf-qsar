# The reproduction run of item 0 of docs/publication_plan.md: the benchmarks are measured again on
# a machine that is not the author's, and the tables rebuilt from the new result files are
# compared with the tables the repository carries. A difference is the finding, not an error of
# the run, so a red job here is a result and has to be read rather than repaired.
#
# Sixty-six of the 104 benchmarks run here: those that register 30 minutes or less and need no
# file or program a runner has not, plus the one named exception the rule allows. The rule, the
# exception and the split into groups are in benchmarks/run_all.py (REPRODUCE_MINUTES,
# REPRODUCE_ALSO, reproduce_groups), `run_all.py --list` prints the groups, and
# docs/release_checklist.md says why each benchmark that is not among them is left out. The
# whole run is about 16.7 hours of computing on the author's machine, in seven groups of about
# 2.4 hours; a GitHub runner stops a job after six hours, so a group fits twice over.
#
# Each group runs `run_all.py --reproduce GROUP`, which is `--compute` with two options a
# reproduction run needs and an ordinary run does not: --fresh, because most scripts keep the
# result files they find and would otherwise measure nothing, and --no-rebuild, because
# --compute rewrites the tables and the manifest when it finishes, which would leave the check
# after it comparing the tables with files the same command had just written. The run of
# 7 November 2026 was green for both of those reasons and had measured almost nothing.
#
# The check itself runs with --against-commit, for a third reason the run of the night of
# 7 November 2026 showed: most scripts write their own results/<name>/table.md while they
# measure, so the file the check reads is already the new table and the comparison is the new
# numbers against themselves. Thirty of the 66 tables moved in that run and a check without
# --against-commit named six of them. --against-commit compares every table with the one the
# repository carries, which is the question a reproduction run asks.
#
# It is started by hand (Actions, "reproduce", Run workflow), because it costs hours of runner
# time and nothing in it changes between pushes.

name: reproduce

on:
  workflow_dispatch:
    inputs:
      group:
        description: 'Which group to run: 1 to 7, or all'
        required: false
        default: all

jobs:
  reproduce:
    name: group ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - name: Skip the groups that were not asked for
        id: want
        run: |
          if [ "${{ github.event.inputs.group }}" = "all" ] || \
             [ "${{ github.event.inputs.group }}" = "${{ matrix.group }}" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.want.outputs.run == 'yes'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Libraries Qt needs on Linux
        if: steps.want.outputs.run == 'yes'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxcb-render-util0 libxcb-image0

      - name: Install the versions the benchmarks were run under
        if: steps.want.outputs.run == 'yes'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .

      - name: The data files are the ones the manifest was made from
        if: steps.want.outputs.run == 'yes'
        run: python benchmarks/run_all.py --check

      # --reproduce measures the group again and leaves the tables and the manifest alone. It
      # fails if a script fails, because a script that did not run leaves the committed results
      # in place, which would look like a measurement that did not move.
      - name: Measure this group again
        if: steps.want.outputs.run == 'yes'
        run: python benchmarks/run_all.py --reproduce ${{ matrix.group }}

      # The tables are rebuilt from the result files this run produced and compared with the ones
      # the repository carries. The step fails if any of them differs, and says for each how many
      # of its numbers moved and by how much.
      - name: Do the new result files give the tables the repository carries
        if: steps.want.outputs.run == 'yes'
        run: python benchmarks/run_all.py --check --against-commit

      - name: What moved, if anything
        if: ${{ always() && steps.want.outputs.run == 'yes' }}
        run: |
          git diff --stat -- benchmarks/results || true
          git diff -- benchmarks/results | head -400 || true

      - name: Keep the result files of this run
        if: ${{ always() && steps.want.outputs.run == 'yes' }}
        uses: actions/upload-artifact@v4
        with:
          name: results-group-${{ matrix.group }}
          # the tables and the records they are built from; the large intermediate files a
          # benchmark writes beside them (quantum outputs, kernels) are not kept
          path: |
            benchmarks/results/**/*.json
            benchmarks/results/**/*.md
            benchmarks/results/**/*.csv
          if-no-files-found: ignore
